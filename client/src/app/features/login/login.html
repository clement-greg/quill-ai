<div class="bg-wrapper" aria-hidden="true">
  <video
    #bgVideo
    class="bg-video"
    src="/video/bg-quill-fantasy-25.mp4"
    autoplay
    muted
    playsinline
  ></video>
</div>
<div class="login-container">
  <mat-card>
    <mat-card-content>
      <div class="robot-area">
        @if (speech()) {
          <div class="robot-speech" role="status" aria-live="polite">
            <span class="robot-speech-text">{{ speech() }}</span>
            <span class="robot-speech-tail" aria-hidden="true"></span>
          </div>
        }
        <lottie-player
          class="robot-lottie"
          src="https://lottie.host/ae16df6a-44fb-4214-9b60-3e0320abdd00/k2kDltgCdz.json"
          background="transparent"
          speed="1"
          loop
          autoplay
          role="img"
          aria-label="Quill AI robot assistant"
        ></lottie-player>
        @if (handoff) {
          <p>Sign in with Google to continue in the Quill AI desktop app.</p>
        } @else {
          <p>Please sign in with your Google account to access the app.</p>
        }
      </div>
      @if (desktop) {
        <div class="google-btn-wrapper desktop-sign-in">
          <button type="button" class="desktop-google-btn" [disabled]="desktopSigningIn()" (click)="signInWithDesktop()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18" height="18" />
            <span>{{ desktopSigningIn() ? 'Finish signing in in your browser…' : 'Sign in with Google' }}</span>
          </button>
          @if (desktopError()) {
            <p class="desktop-error" role="alert">{{ desktopError() }}</p>
          }
        </div>
      }
      <div #googleBtn class="google-btn-wrapper" [hidden]="desktop"></div>
    </mat-card-content>
  </mat-card>
</div>
