@if (ra.active() && !audio.expanded()) {
  <section class="ra-bar" aria-label="Read aloud player">
    <div class="ra-info">
      <div class="ra-title" [title]="title()">{{ title() }}</div>
      <div class="ra-sub">{{ subtitle() }}</div>
      @if (ra.error(); as error) {
        <div class="ra-error" role="alert">{{ error }}</div>
      }
    </div>

    <div class="ra-controls" role="group" aria-label="Playback">
      @if (multiChapter()) {
        <button mat-icon-button type="button" (click)="ra.previousChapter()" [disabled]="atStart()"
          aria-label="Previous chapter" matTooltip="Previous chapter">
          <mat-icon>skip_previous</mat-icon>
        </button>
      }
      <button mat-icon-button type="button" (click)="ra.previousParagraph()" [disabled]="atStart()"
        aria-label="Previous paragraph" matTooltip="Previous paragraph">
        <mat-icon>fast_rewind</mat-icon>
      </button>
      <button mat-flat-button type="button" class="ra-play" (click)="ra.playPause()"
        [attr.aria-label]="playing() ? 'Pause' : 'Play'">
        <mat-icon>{{ playing() ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
      <button mat-icon-button type="button" (click)="ra.nextParagraph()" [disabled]="atEnd()"
        aria-label="Next paragraph" matTooltip="Next paragraph">
        <mat-icon>fast_forward</mat-icon>
      </button>
      @if (multiChapter()) {
        <button mat-icon-button type="button" (click)="ra.nextChapter()" [disabled]="!hasNextChapter()"
          aria-label="Next chapter" matTooltip="Next chapter">
          <mat-icon>skip_next</mat-icon>
        </button>
      }
    </div>

    <div class="ra-settings">
      <app-read-aloud-settings />

      @if (ra.bookId()) {
        <button mat-icon-button type="button" (click)="audio.open()" aria-label="Open player" matTooltip="Open player">
          <mat-icon>keyboard_arrow_up</mat-icon>
        </button>
      }
      <button mat-icon-button type="button" (click)="ra.stop()" aria-label="Close player" matTooltip="Stop and close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </section>
}
