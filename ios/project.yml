# XcodeGen spec for the Quill AI iPhone app. Regenerate the Xcode project after
# editing this file:  cd ios && xcodegen
name: QuillAI
options:
  bundleIdPrefix: app.quillai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer team here (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  QuillAI:
    type: application
    platform: iOS
    sources:
      - path: QuillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quillai.ios
        PRODUCT_NAME: Quill AI
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuillAI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
