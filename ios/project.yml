# XcodeGen spec for the Quill AI iPhone app. Regenerate the Xcode project after
# editing this file:  cd ios && xcodegen
name: QuillAI
options:
  bundleIdPrefix: app.quillai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Apple Developer team that signs the app (Xcode → Signing & Capabilities → Team).
    DEVELOPMENT_TEAM: H85622C95W
    CODE_SIGN_STYLE: Automatic
targets:
  QuillAI:
    type: application
    platform: iOS
    sources:
      - path: QuillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quillai.ios
        PRODUCT_NAME: Quill AI
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuillAI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuillAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuillAITests
    dependencies:
      - target: QuillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quillai.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quill AI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quill AI"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  QuillAI:
    build:
      targets:
        QuillAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuillAITests
