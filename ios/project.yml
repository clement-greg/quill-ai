# XcodeGen spec for the Quill AI iPhone app. Regenerate the Xcode project after
# editing this file:  cd ios && xcodegen
name: QuillAI
options:
  bundleIdPrefix: com.elevatehomescriptions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Apple Developer team that signs the app (Xcode → Signing & Capabilities → Team).
    DEVELOPMENT_TEAM: 6TG74PNFM6
    CODE_SIGN_STYLE: Automatic
targets:
  QuillAI:
    type: application
    platform: iOS
    sources:
      - path: QuillAI
      - path: Shared
    dependencies:
      - target: QuillAIWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elevatehomescriptions.quillai
        PRODUCT_NAME: Quill AI
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuillAI/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuillAI/QuillAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuillAIWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: QuillAIWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elevatehomescriptions.quillai.widgets
        PRODUCT_NAME: QuillAIWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuillAIWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuillAIWidgets/QuillAIWidgets.entitlements
        SKIP_INSTALL: YES
  QuillAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuillAITests
    dependencies:
      - target: QuillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elevatehomescriptions.quillai.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quill AI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quill AI"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  QuillAI:
    build:
      targets:
        QuillAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuillAITests
