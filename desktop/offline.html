<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Quill AI</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f5f2ea;
      color: #222;
    }
    main { text-align: center; max-width: 420px; padding: 16px; }
    h1 { font-weight: 500; }
    p { color: #555; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: #3f6e72;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #9cc3c6; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Quill AI</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      location.href = new URLSearchParams(location.search).get('url');
    });
  </script>
</body>
</html>
